name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DBT_PROFILES_DIR: dbt_project
      DBT_DUCKDB_PATH: data/processed_private/resort_demo.duckdb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: |
          python -m pytest tests_python/

      - name: Generate synthetic demo dataset
        run: |
          python src/00_generate_demo_data.py --output-dir data/demo_sample

      - name: Ingest and anonymize synthetic PMS dataset
        run: |
          python src/01_ingest_and_anonymize.py --demo --output-db data/processed_private/resort_demo.duckdb

      - name: Run dbt build & data tests against demo dataset
        run: |
          dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: Verify end-to-end audit and portfolio export
        run: |
          python src/02_audit_and_export.py --db-path data/processed_private/resort_demo.duckdb
